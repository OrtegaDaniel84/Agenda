<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fondo redondeado moderno estilo app icon -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Hoja del calendario con sombra suave -->
  <g filter="url(#cardShadow)">
    <rect x="10" y="14" width="44" height="40" rx="7" fill="#ffffff"/>
    
    <!-- Barra superior del calendario -->
    <path d="M 10 21 A 7 7 0 0 1 17 14 L 47 14 A 7 7 0 0 1 54 21 L 54 26 L 10 26 Z" fill="#0284c7"/>
    
    <!-- Anillas / broches superiores -->
    <rect x="19" y="10" width="4" height="8" rx="2" fill="#f8fafc" stroke="#0369a1" stroke-width="1.2"/>
    <rect x="41" y="10" width="4" height="8" rx="2" fill="#f8fafc" stroke="#0369a1" stroke-width="1.2"/>

    <!-- Cuadrícula de días y marcas de planificación -->
    <!-- Fila 1 -->
    <rect x="16" y="30" width="6" height="5" rx="1.5" fill="#cbd5e1"/>
    <rect x="25" y="30" width="6" height="5" rx="1.5" fill="#cbd5e1"/>
    <rect x="34" y="30" width="6" height="5" rx="1.5" fill="#198754"/> <!-- Verde planificación -->
    <rect x="43" y="30" width="6" height="5" rx="1.5" fill="#cbd5e1"/>

    <!-- Fila 2 -->
    <rect x="16" y="38" width="6" height="5" rx="1.5" fill="#cbd5e1"/>
    <rect x="25" y="38" width="6" height="5" rx="1.5" fill="#fd7e14"/> <!-- Naranja planificación -->
    <rect x="34" y="38" width="6" height="5" rx="1.5" fill="#0d6efd"/> <!-- Azul día actual -->
    <rect x="43" y="38" width="6" height="5" rx="1.5" fill="#cbd5e1"/>

    <!-- Fila 3 -->
    <rect x="16" y="46" width="6" height="5" rx="1.5" fill="#6f42c1"/> <!-- Morado planificación -->
    <rect x="25" y="46" width="6" height="5" rx="1.5" fill="#cbd5e1"/>
    <rect x="34" y="46" width="6" height="5" rx="1.5" fill="#cbd5e1"/>
    <rect x="43" y="46" width="6" height="5" rx="1.5" fill="#dc3545"/> <!-- Rojo Domingo -->
  </g>
</svg>
