<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal</title>
    <meta name="description" content="Agenda semanal adaptable con visualización en cuadrícula simétrica, integración de calendarios iCal remotos y sincronización persistente en segundo plano">
    <meta property="og:title" content="Agenda Semanal">
    <meta property="og:description" content="Agenda semanal adaptable con visualización en cuadrícula simétrica, integración de calendarios iCal remotos y sincronización persistente en segundo plano">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- FullCalendar Core & Locales -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column p-2 p-md-3">
    <!-- Bloque Superior (Header) -->
    <header class="card shadow-sm border-0 mb-3" id="app-header">
        <div class="card-body py-2 px-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <i class="bi bi-calendar3 fs-4 text-primary"></i>
                <h1 id="current-date-label" class="h5 mb-0 fw-bold text-dark text-capitalize">Cargando semana...</h1>
                <span id="sync-info-badge" class="badge bg-light text-muted border small d-inline-flex align-items-center gap-1 py-1 px-2" title="Los calendarios se consultan cada 15 min y se guardan en la base de datos">
                    <i class="bi bi-database-check text-success" id="sync-status-icon"></i>
                    <span id="sync-time-label">Base de datos al día</span>
                </span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button id="btn-refresh" class="btn btn-outline-primary btn-sm px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm" type="button" title="Forzar consulta a los calendarios y guardar en la base de datos">
                    <i class="bi bi-arrow-clockwise" id="refresh-icon"></i>
                    <span id="refresh-text">Actualizar</span>
                </button>
                <button id="btn-settings" class="btn btn-primary btn-sm px-3 py-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm" type="button" data-bs-toggle="modal" data-bs-target="#modal-calendars">
                    <i class="bi bi-gear-fill"></i>
                    <span>Configurar Calendarios</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Responsive -->
    <div class="container-fluid px-0 flex-grow-1 d-flex flex-column">
        <div class="row g-3 flex-grow-1">
            <!-- Columna 1: Vista Anual (12 Meses) -->
            <div class="col-12 col-md-6 col-xl-3 d-flex flex-column">
                <div id="annual-calendar-card" class="card shadow-sm border-0 h-100 flex-grow-1">
                    <div class="card-header bg-white border-bottom-0 pt-2 pb-1 px-3 d-flex align-items-center justify-content-between">
                        <span class="fw-bold text-dark small"><i class="bi bi-calendar-range me-1 text-primary"></i> Calendario Anual</span>
                        <span id="annual-year-badge" class="badge bg-primary-subtle text-primary border border-primary-subtle"></span>
                    </div>
                    <div class="card-body p-2 pt-0 overflow-y-auto">
                        <div id="annual-calendar" class="annual-months-grid"></div>
                    </div>
                </div>
            </div>

            <!-- Columna 2: Mini Calendario Interactivo + Domingo -->
            <div class="col-12 col-md-6 col-xl-3 d-flex flex-column gap-3">
                <!-- Mini Calendario (Ajustado exactamente al mes sin espacio sobrante) -->
                <div id="mini-calendar-card" class="card shadow-sm border-0 flex-shrink-0 d-flex flex-column">
                    <div class="card-header bg-white border-bottom-0 pt-2 pb-1 px-3 d-flex align-items-center justify-content-between flex-shrink-0">
                        <span class="fw-bold text-dark small">
                            <i class="bi bi-calendar2-month me-1 text-primary"></i> Calendario Mensual
                        </span>
                        <button id="btn-mini-today" type="button" class="btn btn-outline-primary btn-sm py-0 px-2 fs-7 fw-semibold rounded-pill" title="Volver al día y semana actual">
                            Hoy
                        </button>
                    </div>
                    <div class="card-body p-2 px-3 pt-0 pb-2">
                        <div id="mini-calendar" class="w-100"></div>
                    </div>
                </div>

                <!-- Domingo (mismo tamaño simétrico que los demás bloques de días) -->
                <div id="sunday" class="day-block card shadow-sm border-0 d-flex flex-column flex-shrink-0">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-danger fs-6">Domingo</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>
            </div>

            <!-- Columna 3: Lunes, Martes, Miércoles -->
            <div class="col-12 col-md-6 col-xl-3 d-flex flex-column gap-3">
                <!-- Lunes -->
                <div id="monday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark fs-6">Lunes</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>

                <!-- Martes -->
                <div id="tuesday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark fs-6">Martes</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>

                <!-- Miércoles -->
                <div id="wednesday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark fs-6">Miércoles</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>
            </div>

            <!-- Columna 4: Jueves, Viernes, Sábado -->
            <div class="col-12 col-md-6 col-xl-3 d-flex flex-column gap-3">
                <!-- Jueves -->
                <div id="thursday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark fs-6">Jueves</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>

                <!-- Viernes -->
                <div id="friday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-dark fs-6">Viernes</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>

                <!-- Sábado -->
                <div id="saturday" class="day-block card shadow-sm border-0 flex-grow-1 d-flex flex-column">
                    <div class="card-header bg-white border-bottom py-2 px-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-secondary fs-6">Sábado</span>
                        <span class="date-label badge bg-light text-dark border fs-7 fw-semibold"></span>
                    </div>
                    <div class="card-body p-2 overflow-y-auto events-list-wrapper">
                        <div class="events-list d-flex flex-column gap-0"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Gestión de Calendarios (Bootstrap Modal) -->
    <div class="modal fade" id="modal-calendars" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <div class="modal-header border-bottom py-3 px-4">
                    <h5 class="modal-title fw-bold text-dark d-flex align-items-center gap-2" id="modalLabel">
                        <i class="bi bi-calendar-plus text-primary"></i>
                        Fuentes de Calendario
                    </h5>
                    <button type="button" class="btn-close" id="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-calendar" class="d-flex flex-column gap-3 mb-4">
                        <div>
                            <label for="cal-title" class="form-label small fw-semibold text-secondary mb-1">Título del calendario</label>
                            <input type="text" id="cal-title" class="form-control" placeholder="Ej: Trabajo, Personal, Clases" required />
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div>
                                <label for="cal-color" class="form-label small fw-semibold text-secondary mb-1">Color</label>
                                <input type="color" id="cal-color" class="form-control form-control-color border" value="#3b82f6" title="Selecciona un color">
                            </div>
                            <div class="flex-grow-1">
                                <label for="cal-url" class="form-label small fw-semibold text-secondary mb-1">URL iCal / Webcal</label>
                                <input type="url" id="cal-url" class="form-control" placeholder="https://... o webcal://..." required />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success fw-semibold mt-1 d-inline-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-plus-circle-fill"></i>
                            Añadir Calendario
                        </button>
                    </form>

                    <h6 class="fw-bold text-secondary small text-uppercase mb-2">Calendarios Activos</h6>
                    <ul id="list-calendars" class="list-group mb-2 border rounded overflow-y-auto" style="max-height: 180px;"></ul>
                </div>
                <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
